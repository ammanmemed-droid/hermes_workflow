# OpenSpec 中文配置模板
# 用法：openspec init 后覆盖 openspec/config.yaml，或按需合并本文件的 context/rules。
# 本模板使所有 OpenSpec 产出物（proposal/design/tasks/spec）使用简体中文，技术术语保留英文。

schema: spec-driven

context: |
  语言：中文（简体）
  所有产出物必须用简体中文撰写。
  技术术语、代码、命令、文件路径保留英文。

# Per-artifact rules (optional)
# 可按产物类型追加规则，例如：
# rules:
#   proposal:
#     - 提案不超过 500 字
#     - 必须包含"非目标"一节
#   tasks:
#     - 任务拆分为不超过 2 小时的粒度

# Per-operation guidance (optional)
# operations:
#   apply:
#     guidance:
#       - 测试摘要保持简洁
#   archive:
#     guidance:
#       - 完成前总结归档结果
